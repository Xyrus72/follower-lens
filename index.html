<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaScope – Instant Instagram Stats</title>
  <meta name="description" content="Instantly see followers, following, and post count for any public Instagram profile. No login required." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0f;
      --surface: #13131c;
      --surface2:#1c1c2e;
      --border:  rgba(255,255,255,0.08);
      --text:    #f0f0ff;
      --muted:   #8888aa;
      --pink:    #e1306c;
      --purple:  #833ab4;
      --red:     #fd1d1d;
      --grad:    linear-gradient(135deg, var(--red), var(--pink), var(--purple));
      --glow:    0 0 56px rgba(225,48,108,0.2);
      --r: 16px; --rs: 12px;
      --ease: 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 20px 80px; overflow-x: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(140px); pointer-events: none; z-index: 0;
    }
    body::before { width:640px;height:640px; background:radial-gradient(circle,rgba(225,48,108,.13),transparent 70%); top:-260px;left:-200px; }
    body::after  { width:520px;height:520px; background:radial-gradient(circle,rgba(131,58,180,.13),transparent 70%); bottom:-120px;right:-120px; }

    .page { position:relative; z-index:1; width:100%; max-width:640px; }

    /* Logo */
    .logo-wrap { display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px; }
    .logo-icon {
      width:46px;height:46px;border-radius:14px;background:var(--grad);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 8px 28px rgba(225,48,108,.35);
    }
    .logo-text { font-size:28px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .tagline { text-align:center;color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:36px; }

    /* Card */
    .card {
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:28px;box-shadow:var(--glow),0 6px 40px rgba(0,0,0,.5);
    }
    .field-label {
      font-size:11.5px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:10px;
    }
    .input-row { display:flex;gap:10px; }
    .inp-wrap  { position:relative;flex:1; }
    .inp-icon  { position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none; }

    #urlInput {
      width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);
      color:var(--text);font-family:inherit;font-size:14.5px;padding:13px 14px 13px 42px;outline:none;
      transition:border-color var(--ease),box-shadow var(--ease);
    }
    #urlInput::placeholder { color:var(--muted); }
    #urlInput:focus { border-color:var(--pink);box-shadow:0 0 0 3px rgba(225,48,108,.15); }

    #fetchBtn {
      flex-shrink:0;background:var(--grad);color:#fff;border:none;border-radius:var(--rs);
      font-family:inherit;font-size:14.5px;font-weight:700;padding:13px 22px;cursor:pointer;white-space:nowrap;
      transition:opacity var(--ease),transform var(--ease),box-shadow var(--ease);
    }
    #fetchBtn:hover:not(:disabled) { opacity:.88;transform:translateY(-2px);box-shadow:0 10px 30px rgba(225,48,108,.4); }
    #fetchBtn:disabled { opacity:.4;cursor:not-allowed; }

    .hint { font-size:12px;color:var(--muted);margin-top:9px; }

    #statusMsg {
      margin-top:16px;font-size:13.5px;font-weight:500;min-height:20px;text-align:center;
      transition:color var(--ease);
    }
    #statusMsg.err  { color:#f87171; }
    #statusMsg.ok   { color:#4ade80; }
    #statusMsg.info { color:var(--muted); }

    /* Result */
    #result { margin-top:22px;display:none;animation:fadeUp .35s ease both; }

    .profile-banner {
      background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
      padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;
    }
    .avatar { width:52px;height:52px;border-radius:50%;background:var(--grad);padding:2.5px;flex-shrink:0; }
    .avatar-inner { width:100%;height:100%;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px; }
    .pinfo { min-width:0; }
    .p-handle { font-size:15px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .p-name   { font-size:12.5px;color:var(--muted);margin-top:2px; }
    .p-link   {
      margin-left:auto;flex-shrink:0;font-size:12px;font-weight:600;color:var(--pink);
      text-decoration:none;padding:6px 13px;border:1px solid rgba(225,48,108,.3);
      border-radius:8px;transition:background var(--ease);
    }
    .p-link:hover { background:rgba(225,48,108,.1); }

    .stats-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:12px; }
    .stat-card {
      background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);
      padding:20px 12px;text-align:center;
      transition:transform var(--ease),box-shadow var(--ease),border-color var(--ease);
    }
    .stat-card:hover { transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.5);border-color:rgba(225,48,108,.3); }
    .s-icon { font-size:22px;margin-bottom:8px; }
    .s-val  { font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1; }
    .s-label{ font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:6px; }

    .notice {
      margin-top:24px;padding:13px 16px;background:rgba(255,255,255,.025);
      border:1px solid var(--border);border-radius:10px;
      font-size:12px;color:var(--muted);line-height:1.7;text-align:center;
    }
    .notice b { color:var(--text); }
    .notice code { background:var(--surface2);border-radius:5px;padding:1px 6px;font-size:11.5px;color:#c084fc; }

    .spinner {
      display:inline-block;width:14px;height:14px;
      border:2.5px solid rgba(255,255,255,.2);border-top-color:currentColor;
      border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:6px;
    }
    @keyframes spin   { to { transform:rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0;transform:translateY(14px); } to { opacity:1;transform:translateY(0); } }

    @media (max-width:480px) {
      .input-row { flex-direction:column; }
      .stats-grid { gap:9px; }
      .s-val { font-size:22px; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/>
      </svg>
    </div>
    <span class="logo-text">InstaScope</span>
  </div>
  <p class="tagline">Paste any public Instagram profile link — get followers, following &amp; posts instantly.<br>No login required.</p>

  <!-- Main card -->
  <div class="card">
    <label class="field-label" for="urlInput">Instagram Profile URL or Username</label>
    <div class="input-row">
      <div class="inp-wrap">
        <span class="inp-icon">📸</span>
        <input type="text" id="urlInput"
               placeholder="instagram.com/cristiano  or  @cristiano"
               autocomplete="off" autocorrect="off" spellcheck="false" />
      </div>
      <button id="fetchBtn" onclick="fetchStats()">Fetch</button>
    </div>
    <p class="hint">✓ Accepts full URLs, @handles, or plain usernames</p>

    <div id="statusMsg" class="info"></div>

    <!-- Result -->
    <div id="result">
      <div class="profile-banner">
        <div class="avatar"><div class="avatar-inner">📷</div></div>
        <div class="pinfo">
          <div class="p-handle" id="rHandle"></div>
          <div class="p-name"   id="rName"></div>
        </div>
        <a id="rLink" href="#" target="_blank" rel="noopener" class="p-link">Open ↗</a>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="s-icon">👥</div>
          <div class="s-val" id="sFollowers">—</div>
          <div class="s-label">Followers</div>
        </div>
        <div class="stat-card">
          <div class="s-icon">➕</div>
          <div class="s-val" id="sFollowing">—</div>
          <div class="s-label">Following</div>
        </div>
        <div class="stat-card">
          <div class="s-icon">🖼️</div>
          <div class="s-val" id="sPosts">—</div>
          <div class="s-label">Posts</div>
        </div>
      </div>
    </div>
  </div>

  <div class="notice">
    ⚡ Requires <b>app.py</b> running locally on <code>localhost:5000</code> — start with <code>python app.py</code>
  </div>

</div>
<script>
  const fmt = n => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return n.toLocaleString();
  };
  const setStatus = (m, t = 'info') => {
    const e = document.getElementById('statusMsg');
    e.className = t; e.innerHTML = m;
  };

  async function fetchStats() {
    const raw = document.getElementById('urlInput').value.trim();
    const btn = document.getElementById('fetchBtn');
    if (!raw) { setStatus('⚠️ Please enter a username or profile URL.', 'err'); return; }

    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Fetching…';
    setStatus('<span class="spinner"></span>Loading…', 'info');
    document.getElementById('result').style.display = 'none';

    try {
      const r = await fetch('http://127.0.0.1:5000/quick_scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: raw }),
      });
      const d = await r.json();

      if (!r.ok) { setStatus('❌ ' + (d.error || 'Something went wrong.'), 'err'); return; }

      document.getElementById('rHandle').textContent    = '@' + d.username;
      document.getElementById('rName').textContent      = d.full_name || '';
      document.getElementById('rLink').href             = d.profile_url;
      document.getElementById('sFollowers').textContent = fmt(d.followers);
      document.getElementById('sFollowing').textContent = fmt(d.following);
      document.getElementById('sPosts').textContent     = fmt(d.posts);

      document.getElementById('result').style.display = 'block';
      setStatus('✅ Done!', 'ok');

    } catch {
      setStatus('❌ Cannot reach local server — make sure <b>app.py</b> is running on port 5000.', 'err');
    } finally {
      btn.disabled = false; btn.innerHTML = 'Fetch';
    }
  }

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchStats();
  });
</script>
</body>
</html>
